name: 'Setup Bella CLI'
description: >
  Install the Bella CLI on Linux, macOS, or Windows.
  Self-contained binary — no Node.js, no .NET runtime, no package manager required.

branding:
  icon: 'lock'
  color: 'purple'

inputs:
  version:
    description: >
      CLI version to install (semver without "v", e.g. 1.2.3).
      Omit or set to "latest" to always install the latest release.
    required: false
    default: 'latest'
  bella-url:
    description: >
      Bella Baxter API base URL.
      When provided, exported as BELLA_BAXTER_URL for all subsequent steps in the job.
    required: false
  oidc:
    description: >
      Set to "true" to exchange the job's GitHub OIDC token for a short-lived Bella API key.
      Requires id-token: write permission in the workflow job, a Trust Domain on the environment
      (console, environment, Identity tab), and the tenant, project and environment slugs
      (inputs below, or BELLA_BAXTER_TENANT / BELLA_BAXTER_PROJECT / BELLA_BAXTER_ENV in the job's env).
      On success the key is exported, masked, as BELLA_BAXTER_API_KEY (and the legacy alias BELLA_API_KEY)
      for all later steps in the job; `bella run -- <command>` then uses that key's own project and environment.
    required: false
    default: 'false'
  tenant:
    description: >
      Tenant (organisation) slug. Only used when oidc is "true"; required then, here or as BELLA_BAXTER_TENANT.
      When both are set, the input wins.
    required: false
  project:
    description: >
      Project slug. Only used when oidc is "true"; required then, here or as BELLA_BAXTER_PROJECT.
      When both are set, the input wins.
    required: false
  environment:
    description: >
      Environment slug. Only used when oidc is "true"; required then, here or as BELLA_BAXTER_ENV.
      When both are set, the input wins.
    required: false
  audience:
    description: >
      OIDC audience to request. Only used when oidc is "true". Must be one the Trust Domain accepts.
      Omit to use BELLA_OIDC_AUDIENCE if the job sets it, else the default "bella-baxter".
    required: false

outputs:
  bella-version:
    description: 'The installed Bella CLI version string.'
    value: ${{ steps.read-version.outputs.version }}

runs:
  using: 'composite'
  steps:
    # ── Fetch + verify the installer from the release it installs (#828) ───────
    # The installer used to be piped from bella-baxter-cli's `main` branch, so pinning this Action
    # pinned nothing that ran. It is now downloaded from the resolved release and executed only after
    # its SHA-256 matches that release's checksums.txt, whose GPG signature must verify against the
    # fingerprint pinned in fetch-installer.sh — a file that IS pinned by the ref you use here.
    - name: Fetch and verify Bella CLI installer
      id: installer
      shell: bash
      env:
        BELLA_INSTALL_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/fetch-installer.sh"

    # ── Linux / macOS ──────────────────────────────────────────────────────────
    - name: Install Bella CLI (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        BELLA_VERSION_RESOLVED: ${{ steps.installer.outputs.version }}
        BELLA_INSTALLER: ${{ steps.installer.outputs.installer }}
        # Install to a writable temp directory — no sudo required on managed runners.
        BELLA_INSTALL_DIR: ${{ runner.temp }}/bella-bin
      run: |
        mkdir -p "$BELLA_INSTALL_DIR"

        # BELLA_INSTALL_DIR is read by the install script. The version is passed explicitly so the
        # script installs exactly the release it was verified against.
        bash "$BELLA_INSTALLER" --version "$BELLA_VERSION_RESOLVED"

        echo "$BELLA_INSTALL_DIR" >> "$GITHUB_PATH"

    # ── Windows ────────────────────────────────────────────────────────────────
    - name: Install Bella CLI (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        # BELLA_VERSION and BELLA_INSTALL_DIR are read by the install script.
        BELLA_VERSION: ${{ steps.installer.outputs.version }}
        BELLA_INSTALLER: ${{ steps.installer.outputs.installer }}
        BELLA_INSTALL_DIR: ${{ runner.temp }}\bella-bin
      run: |
        New-Item -ItemType Directory -Force -Path $env:BELLA_INSTALL_DIR | Out-Null

        # A child process, so the script's `exit 1` on a failed check fails this step.
        pwsh -NoProfile -ExecutionPolicy Bypass -File $env:BELLA_INSTALLER
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        # Add to GITHUB_PATH so subsequent steps can find the binary.
        $env:BELLA_INSTALL_DIR | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # ── Verify & capture version ───────────────────────────────────────────────
    - name: Read installed version
      id: read-version
      shell: bash
      run: |
        VERSION=$(bella --version 2>&1 | head -1)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Bella CLI $VERSION installed successfully."

    # ── Optional: export API URL for subsequent steps ──────────────────────────
    - name: Export BELLA_BAXTER_URL
      if: inputs.bella-url != ''
      shell: bash
      env:
        BELLA_URL: ${{ inputs.bella-url }}
      run: |
        echo "BELLA_BAXTER_URL=$BELLA_URL" >> "$GITHUB_ENV"

    # ── Optional: OIDC token exchange for short-lived Bella API key ────────────
    # `bella auth oidc` needs the tenant, project and environment slugs: without them the API answers
    # 422 missing_context. Each input overrides only when non-empty, so a job-level env var of the same
    # name keeps working. The URL uses `inputs.bella-url` first rather than relying on the previous
    # step's GITHUB_ENV write being visible in the env context. An empty BELLA_OIDC_AUDIENCE is
    # treated as unset by the CLI (WorkloadIdentityService.ResolveOidcAudience), so the default applies.
    - name: Authenticate via OIDC
      if: inputs.oidc == 'true'
      shell: bash
      env:
        BELLA_BAXTER_URL: ${{ inputs.bella-url || env.BELLA_BAXTER_URL || 'https://api.bella-baxter.io' }}
        BELLA_BAXTER_TENANT: ${{ inputs.tenant || env.BELLA_BAXTER_TENANT }}
        BELLA_BAXTER_PROJECT: ${{ inputs.project || env.BELLA_BAXTER_PROJECT }}
        BELLA_BAXTER_ENV: ${{ inputs.environment || env.BELLA_BAXTER_ENV }}
        BELLA_OIDC_AUDIENCE: ${{ inputs.audience || env.BELLA_OIDC_AUDIENCE }}
      run: |
        missing=""
        [ -n "$BELLA_BAXTER_TENANT" ]  || missing="$missing tenant"
        [ -n "$BELLA_BAXTER_PROJECT" ] || missing="$missing project"
        [ -n "$BELLA_BAXTER_ENV" ]     || missing="$missing environment"
        # A .bella file (org / project / environment) can still supply them: the CLI reads the nearest one.
        dir="$PWD"
        while [ -n "$missing" ] && [ "$dir" != "/" ] && [ -n "$dir" ]; do
          [ -f "$dir/.bella" ] && missing=""
          dir="$(dirname "$dir")"
        done
        if [ -n "$missing" ]; then
          echo "::error title=Bella OIDC::oidc is 'true' but these are not set:$missing. Pass them as inputs of this action (tenant, project, environment) or set BELLA_BAXTER_TENANT, BELLA_BAXTER_PROJECT and BELLA_BAXTER_ENV in the job's env, or commit a .bella file."
          exit 1
        fi
        bella auth oidc
